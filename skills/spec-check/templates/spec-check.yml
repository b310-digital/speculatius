name: spec-check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  spec-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Spec gates
        run: node scripts/spec-check.mjs
